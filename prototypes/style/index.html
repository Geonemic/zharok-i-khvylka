<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жарок і Хвилька — прототип стилю</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0b1f; --ink: #fff4e0; --muted: #b9b3d9; --gold: #f3c14b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--ink); font-family: Nunito, system-ui, sans-serif; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 30%, #1a1840 0%, var(--bg) 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #stage { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 2px #2b2656, 0 18px 60px rgba(0, 0, 0, .6); }
  canvas { display: block; width: 100%; height: 100%; transition: filter .3s; }
  #lang { position: absolute; top: .7%; right: 1%; display: flex; gap: 2px; background: rgba(12, 10, 34, .8); border: 1px solid rgba(243, 193, 75, .5); border-radius: 999px; padding: 2px; }
  #lang button { font: 800 12px Nunito, system-ui, sans-serif; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 3px 9px; cursor: pointer; }
  #lang button.on { background: var(--gold); color: #2a1a08; }
  #help { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 14px; color: var(--muted); padding: 0 16px; }
  #help b { color: var(--ink); font-weight: 800; }
  kbd { font: 800 12px Nunito, system-ui, sans-serif; color: var(--ink); background: #25214a; border: 1px solid #3d3772; border-bottom-width: 3px; border-radius: 6px; padding: 1px 7px; margin-left: 3px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="lang"><button data-lang="uk">УКР</button><button data-lang="en">ENG</button></div>
</div>
<div id="help"></div>
<script>
'use strict';
// Прототип стилю «Жарок і Хвилька». Мета — оцінити вигляд і відчуття, а не фінальний код:
// справжня гра буде на PixiJS із детермінованою симуляцією (див. docs/design.md).

// ===== Константи =====
const W = 1280, H = 720, T = 40, TAU = Math.PI * 2;
const STEP = 1 / 60;
const GRAV = 0.55, MAXFALL = 12, RUN = 4.2, JUMP = 10.8, LINK_BOOST = 1.3;
const POOL_INSET = 14, STEP_UP = 16, DEATH_T = 70;
const GATE_OPEN_SPEED = 0.04, GATE_CLOSE_SPEED = 0.09; // частка висоти воріт за тік

// ===== Переклади =====
const I18N = {
  uk: {
    title: 'Жарок і Хвилька',
    help: [['Жарок', ['W', 'A', 'D']], ['Хвилька', ['↑', '←', '→']], ['Взятися за руки (поруч)', ['S', '↓']], ['Персонажі зблизька', ['C']], ['Заново', ['R']], ['Сірий режим', ['G']]],
    nameZharok: 'Жарок', nameKhvylka: 'Хвилька',
    descZharok: ['Дух купальського вогнища.', 'Ходить по жару, але гасне у воді.'],
    descKhvylka: ['Дух річки з купальським віночком.', 'Ходить по воді, але випаровується в жару.'],
    showcaseHint: 'C — повернутися до гри',
    linked: 'Пара! Тримаючись за руки, ви стрибаєте вище й разом',
    unlinked: 'Руки роз’єднано',
    closer: 'Підійдіть ближче одне до одного',
    deathZharok: 'Жарок згас у воді',
    deathKhvylka: 'Хвилька випарувалася в жару',
    deathBog: 'Трясовина небезпечна для обох!',
    heart: 'Бонус: серце! Його можна дістати лише удвох',
    win: 'Рівень пройдено!',
    time: 'Час',
    diamondGot: 'Діамантова зірка — за сердечко, здобуте удвох!',
    diamondHint: 'Діамантова зірка: дістаньте сердечко удвох',
    again: 'Ще раз · R',
    grayOn: 'Сірий режим: перевірка читабельності',
    grayOff: 'Кольоровий режим',
  },
  en: {
    title: 'Zharok & Khvylka',
    help: [['Zharok', ['W', 'A', 'D']], ['Khvylka', ['↑', '←', '→']], ['Hold hands (when close)', ['S', '↓']], ['Close-up', ['C']], ['Restart', ['R']], ['Grayscale', ['G']]],
    nameZharok: 'Zharok', nameKhvylka: 'Khvylka',
    descZharok: ['Spirit of the Kupala bonfire.', 'Walks through embers, but water puts him out.'],
    descKhvylka: ['River spirit with a Kupala wreath.', 'Walks through water, but embers make her evaporate.'],
    showcaseHint: 'C — back to the game',
    linked: 'Steam! Holding hands, you jump higher, together',
    unlinked: 'Hands let go',
    closer: 'Get closer to each other',
    deathZharok: 'Zharok was put out by the water',
    deathKhvylka: 'Khvylka evaporated in the embers',
    deathBog: 'The bog is dangerous for both!',
    heart: 'Bonus heart! Only reachable together',
    win: 'Level complete!',
    time: 'Time',
    diamondGot: 'Diamond star — for the heart you reached together!',
    diamondHint: 'Diamond star: reach the heart together',
    again: 'Again · R',
    grayOn: 'Grayscale: readability check',
    grayOff: 'Color mode',
  },
};
let lang = 'uk';
try { lang = localStorage.getItem('zh-lang') || 'uk'; } catch (e) { /* без сховища — мова за замовчуванням */ }
if (!I18N[lang]) lang = 'uk';
const tr = (k) => I18N[lang][k];

// ===== Утиліти =====
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const backOut = (x) => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
const noise1 = (x) => Math.sin(x * 1.3 + Math.sin(x * 0.7) * 1.7) * 0.5 + Math.sin(x * 2.9 + 1.3) * 0.3 + Math.sin(x * 5.3 + 0.4) * 0.2;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = Math.random;

// ===== Рівень =====
// # камінь · F жар · W вода · B трясовина · = дерев'яна платформа (можна застрибнути знизу)
const R = (...s) => { let o = ''; for (let i = 0; i < s.length; i += 2) o += s[i].repeat(s[i + 1]); return o; };
const MAP = [
  R('#', 32),
  R('#', 1, '.', 12, '#', 3, '.', 15, '#', 1),
  R('#', 1, '.', 12, '#', 3, '.', 15, '#', 1),
  R('#', 1, '.', 22, '=', 2, '.', 6, '#', 1),
  R('#', 1, '.', 30, '#', 1),
  R('#', 1, '.', 30, '#', 1),
  R('#', 1, '.', 30, '#', 1),
  R('#', 1, '.', 2, '#', 18, 'B', 2, '#', 9),
  R('#', 1, '.', 30, '#', 1),
  R('#', 3, '.', 28, '#', 1),
  R('#', 3, '.', 28, '#', 1),
  R('#', 4, '.', 27, '#', 1),
  R('#', 8, 'F', 2, '#', 4, 'W', 6, '#', 6, '=', 2, '.', 3, '#', 1),
  R('#', 1, '.', 30, '#', 1),
  R('#', 1, '.', 28, '#', 3),
  R('#', 1, '.', 28, '#', 3),
  R('#', 1, '.', 25, '#', 6),
  R('#', 6, 'F', 3, '#', 2, 'W', 3, '#', 2, 'B', 2, '#', 14),
];
const ROWS = MAP.length, COLS = MAP[0].length;
console.assert(MAP.every((r) => r.length === COLS), 'Усі рядки карти мають бути однакової довжини');
const tileAt = (c, r) => (c < 0 || r < 0 || c >= COLS || r >= ROWS ? '#' : MAP[r][c]);
const isLiquid = (ch) => ch === 'F' || ch === 'W' || ch === 'B';
const isSolidish = (ch) => ch === '#' || isLiquid(ch);

const pools = [];
for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; ) {
    const ch = MAP[r][c];
    if (!isLiquid(ch)) { c++; continue; }
    let e = c;
    while (e + 1 < COLS && MAP[r][e + 1] === ch) e++;
    pools.push({ kind: ch, x0: c * T, x1: (e + 1) * T, y: r * T, bubbles: [] });
    c = e + 1;
  }
}

const SPAWNS = {
  zharok: [{ x: 100, y: 680 }, { x: 1060, y: 480 }, { x: 150, y: 280 }],
  khvylka: [{ x: 140, y: 680 }, { x: 1100, y: 480 }, { x: 190, y: 280 }],
};
const ITEM_DEFS = [
  { kind: 'spark', x: 300, y: 660 }, { kind: 'drop', x: 500, y: 660 },
  { kind: 'spark', x: 360, y: 458 }, { kind: 'drop', x: 700, y: 458 },
  { kind: 'spark', x: 460, y: 180 }, { kind: 'drop', x: 740, y: 180 },
  { kind: 'heart', x: 960, y: 92 },
];
const PLATE_Y = 280;
const plates = [{ x: 404, w: 32, pressed: false, depress: 0 }, { x: 684, w: 32, pressed: false, depress: 0 }];
const gate = { x: 580, top: 120, h: 160, w: 22, open: 0 };
const lilies = [{ x: 620, ph: 0 }, { x: 700, ph: 2.1, flower: true }, { x: 780, ph: 4.2 }]
  .map((l) => ({ ...l, base: 12 * T + 3, top: 12 * T + 3, dy: 0, sink: 0 }));
const doors = [{ owner: 'zharok', x: 1090, open: 0, lit: 0, at: false }, { owner: 'khvylka', x: 1180, open: 0, lit: 0, at: false }];

// ===== Стан =====
function makeChar(kind) {
  return {
    kind, w: 26, h: 34, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0,
    grounded: false, ground: null, coyote: 0, jumpBuf: 0, airT: 0, linkJump: false,
    facing: 1, alive: true, deathT: 0, deathKind: '', deathSurf: 0, tier: 0,
    sx: 1, sy: 1, svx: 0, svy: 0, blink: 0, blinkT: 60 + rnd() * 120, blinkAnim: 0,
    runPhase: 0, appear: 0, linkDir: 0,
  };
}
const chars = [makeChar('zharok'), makeChar('khvylka')];
const other = (ch) => (ch === chars[0] ? chars[1] : chars[0]);
const state = { items: [], counts: {}, linked: false, won: false, result: null, ticks: 0, winTicks: 0, toasts: [] };
const parts = [], uiParts = [];
let gray = false;

function placeAt(ch, p) { ch.x = ch.px = p.x - ch.w / 2; ch.y = ch.py = p.y - ch.h; ch.vx = ch.vy = 0; }

function reset() {
  for (const ch of chars) { Object.assign(ch, makeChar(ch.kind)); placeAt(ch, SPAWNS[ch.kind][0]); ch.appear = 1; }
  state.items = ITEM_DEFS.map((d) => ({ ...d, taken: false }));
  state.counts = { spark: 0, drop: 0, heart: 0 };
  state.linked = false; state.won = false; state.ticks = 0; state.winTicks = 0; state.toasts = [];
  state.result = null; hoverAgain = false; canvas.style.cursor = '';
  gate.open = 0; parts.length = 0; uiParts.length = 0;
  for (const d of doors) { d.open = 0; d.lit = 0; d.at = false; }
  for (const p of plates) { p.pressed = false; p.depress = 0; }
}

function toast(key) { state.toasts = [{ key, t: 170 }]; }

// ===== Введення (e.code — фізичні клавіші, тож працює з будь-якою розкладкою) =====
const KEYS = {
  zharok: { left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS' },
  khvylka: { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown' },
};
const down = new Set(), pressed = new Set();
addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  down.add(e.code); pressed.add(e.code);
  if (e.code === 'KeyR') reset();
  if (e.code === 'KeyG') { gray = !gray; canvas.style.filter = gray ? 'grayscale(1)' : ''; toast(gray ? 'grayOn' : 'grayOff'); }
  if (e.code === 'KeyC') showcase = !showcase;
});
addEventListener('keyup', (e) => down.delete(e.code));
addEventListener('blur', () => down.clear());

// ===== Фізика =====
const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function gateRect(open) {
  const h = gate.h * (1 - open);
  return h > 0.5 ? { x: gate.x - gate.w / 2, y: gate.top, w: gate.w, h, oneWay: false } : null;
}
const solids = [];
function gatherSolids(x0, y0, x1, y1) {
  solids.length = 0;
  for (let r = Math.floor(y0 / T); r <= Math.floor(y1 / T); r++) {
    for (let c = Math.floor(x0 / T); c <= Math.floor(x1 / T); c++) {
      const ch = tileAt(c, r), x = c * T, y = r * T;
      if (ch === '#') solids.push({ x, y, w: T, h: T, oneWay: false });
      else if (isLiquid(ch)) solids.push({ x, y: y + POOL_INSET, w: T, h: T - POOL_INSET, oneWay: false });
      else if (ch === '=') solids.push({ x, y, w: T, h: 12, oneWay: true });
    }
  }
  const gr = gateRect(gate.open);
  if (gr) solids.push(gr);
  for (const l of lilies) solids.push({ x: l.x - 22, y: l.top, w: 44, h: 8, oneWay: true, lily: l });
}
function hitsAny(box) {
  for (const s of solids) if (!s.oneWay && overlaps(box, s)) return true;
  return false;
}
function moveChar(ch) {
  const m = 16 + Math.abs(ch.vx) + Math.abs(ch.vy);
  gatherSolids(ch.x - m, ch.y - m, ch.x + ch.w + m, ch.y + ch.h + m);
  ch.x += ch.vx;
  for (const s of solids) {
    if (s.oneWay || !overlaps(ch, s)) continue;
    const rise = ch.y + ch.h - s.y;
    // невеликі сходинки (край басейну) переступаємо автоматично
    if (ch.grounded && rise > 0 && rise <= STEP_UP && !hitsAny({ x: ch.x, y: s.y - ch.h, w: ch.w, h: ch.h })) { ch.y = s.y - ch.h; continue; }
    ch.x = ch.x + ch.w / 2 < s.x + s.w / 2 ? s.x - ch.w : s.x + s.w;
    ch.vx = 0;
  }
  const prevBottom = ch.y + ch.h;
  ch.y += ch.vy;
  ch.grounded = false; ch.ground = null;
  for (const s of solids) {
    if (!overlaps(ch, s)) continue;
    if (s.oneWay) {
      if (ch.vy >= 0 && prevBottom <= s.y + (s.lily ? 4 : 0.01)) { ch.y = s.y - ch.h; ch.vy = 0; ch.grounded = true; ch.ground = s; }
      continue;
    }
    if (ch.vy > 0) { ch.y = s.y - ch.h; ch.vy = 0; ch.grounded = true; ch.ground = s; }
    else { ch.y = s.y + s.h; ch.vy = 0; }
  }
}

function doJump(ch, boost) {
  ch.vy = -JUMP * boost; ch.jumpBuf = 0; ch.coyote = 0; ch.grounded = false; ch.ground = null;
  ch.linkJump = boost > 1; ch.sx = 0.78; ch.sy = 1.28; ch.svx = ch.svy = 0;
  const fx = ch.x + ch.w / 2, fy = ch.y + ch.h;
  for (let i = 0; i < 6; i++) emit('steam', fx + (rnd() - 0.5) * 16, fy - 2, { vx: (rnd() - 0.5) * 1.6, vy: -rnd() * 0.6, size: 2 + rnd() * 2, grow: 0.08, life: 26, col: '#c9c2ea' });
  if (boost > 1) for (let i = 0; i < 10; i++) emit('steam', fx + (rnd() - 0.5) * 30, fy - 4, { vx: (rnd() - 0.5) * 2, vy: -0.5 - rnd(), size: 3 + rnd() * 3, grow: 0.15, life: 45, col: '#f4f7ff' });
}

function land(ch, fallV) {
  const k = clamp(fallV / MAXFALL, 0, 1);
  ch.sx = 1.06 + 0.3 * k; ch.sy = 0.94 - 0.28 * k; ch.svx = ch.svy = 0;
  if (fallV > 4) {
    const fx = ch.x + ch.w / 2, fy = ch.y + ch.h;
    for (let i = 0; i < 7; i++) {
      const s = i % 2 ? 1 : -1;
      if (ch.kind === 'khvylka') emit('dot', fx + s * 6, fy - 3, { vx: s * (0.8 + rnd() * 1.6), vy: -1 - rnd() * 1.6, g: 0.2, size: 1.6, life: 26, col: '#a6eaff' });
      else emit('spark', fx + s * 6, fy - 3, { vx: s * (0.8 + rnd() * 1.6), vy: -0.6 - rnd() * 1.4, g: 0.05, size: 1.6, life: 26, col: '#ffcf6a', add: true, sprite: glow.fire });
    }
  }
}

function checkHazard(ch) {
  const bottom = ch.y + ch.h, r = Math.floor((bottom - 1) / T);
  for (let c = Math.floor((ch.x + 4) / T); c <= Math.floor((ch.x + ch.w - 4) / T); c++) {
    const t = tileAt(c, r);
    if (!isLiquid(t) || bottom < r * T + 10) continue;
    if (t === 'B' || (t === 'W' && ch.kind === 'zharok') || (t === 'F' && ch.kind === 'khvylka')) { kill(ch, t, r * T + 8); return; }
  }
}

function kill(ch, liquid, surf) {
  ch.alive = false; ch.deathT = DEATH_T; ch.deathSurf = surf; ch.vx = ch.vy = 0;
  ch.deathKind = liquid === 'B' ? 'sink' : ch.kind === 'zharok' ? 'extinguish' : 'evaporate';
  const cx = ch.x + ch.w / 2, cy = ch.y + ch.h - 18;
  if (ch.deathKind === 'sink') {
    for (let i = 0; i < 10; i++) emit('ring', cx + (rnd() - 0.5) * 30, surf, { vy: -0.2, size: 2 + rnd() * 3, grow: 0.12, life: 30 + rnd() * 20, col: '#d3e27a' });
    toast('deathBog');
  } else {
    const col = ch.deathKind === 'extinguish' ? '#e4e6ef' : '#dff4ff';
    for (let i = 0; i < 30; i++) emit('steam', cx + (rnd() - 0.5) * 24, cy + (rnd() - 0.5) * 20, { vx: (rnd() - 0.5) * 1.4, vy: -0.6 - rnd() * 1.5, size: 3 + rnd() * 5, grow: 0.16, life: 50 + rnd() * 40, col });
    if (ch.deathKind === 'extinguish') {
      for (let i = 0; i < 8; i++) emit('dot', cx, cy, { vx: (rnd() - 0.5) * 3, vy: -1 - rnd() * 2, g: 0.18, size: 1.8, life: 40, col: '#5a2a1a' });
      toast('deathZharok');
    } else {
      for (let i = 0; i < 10; i++) emit('dot', cx, cy, { vx: (rnd() - 0.5) * 3, vy: -1.5 - rnd() * 2, g: 0.12, size: 1.6, life: 40, col: '#8fdcff' });
      toast('deathKhvylka');
    }
  }
  if (state.linked) setLinked(false, true);
}

function respawn(ch) {
  placeAt(ch, SPAWNS[ch.kind][ch.tier]);
  ch.alive = true; ch.appear = 1; ch.sx = 1; ch.sy = 1;
  const cx = ch.x + ch.w / 2, cy = ch.y + ch.h / 2;
  const col = ch.kind === 'zharok' ? '#ffd27a' : '#bdf0ff';
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * TAU;
    emit('star', cx + Math.cos(a) * 26, cy + Math.sin(a) * 26, { vx: -Math.cos(a) * 1.2, vy: -Math.sin(a) * 1.2, size: 1.6, life: 24, col, add: true, vr: 0.2 });
  }
}

function updateChar(ch) {
  ch.px = ch.x; ch.py = ch.y;
  if (--ch.blinkT <= 0) { ch.blinkT = 120 + rnd() * 220; ch.blinkAnim = 10; }
  if (ch.blinkAnim > 0) ch.blinkAnim--;
  ch.blink = ch.blinkAnim > 0 ? Math.sin((Math.PI * ch.blinkAnim) / 10) : 0;
  ch.svx = (ch.svx + (1 - ch.sx) * 0.22) * 0.72; ch.sx += ch.svx;
  ch.svy = (ch.svy + (1 - ch.sy) * 0.22) * 0.72; ch.sy += ch.svy;

  if (!ch.alive) {
    ch.deathT--;
    const cx = ch.x + ch.w / 2;
    if (ch.deathKind === 'sink' && rnd() < 0.3) emit('ring', cx + (rnd() - 0.5) * 20, ch.deathSurf, { size: 1.5 + rnd() * 2, grow: 0.1, life: 24, col: '#d3e27a' });
    else if (ch.deathKind !== 'sink' && ch.deathT > 30 && rnd() < 0.4) emit('steam', cx + (rnd() - 0.5) * 16, ch.y + 10, { vy: -0.8 - rnd(), size: 3 + rnd() * 3, grow: 0.15, life: 50, col: '#eef3fa' });
    if (ch.deathT <= 0) respawn(ch);
    return;
  }
  if (ch.appear > 0) ch.appear = Math.max(0, ch.appear - 0.07);

  const k = KEYS[ch.kind], ctl = !state.won; // після перемоги герої заходять у двері, керування вимкнене
  const dir = ctl ? (down.has(k.right) ? 1 : 0) - (down.has(k.left) ? 1 : 0) : 0;
  const up = ctl && down.has(k.up);
  if (dir) ch.facing = dir;
  const acc = ch.grounded ? 0.8 : 0.5;
  ch.vx += clamp(dir * RUN - ch.vx, -acc, acc);

  if (ctl && pressed.has(k.up)) ch.jumpBuf = 7; else if (ch.jumpBuf > 0) ch.jumpBuf--;
  if (ch.grounded) ch.coyote = 6; else if (ch.coyote > 0) ch.coyote--;
  if (ch.jumpBuf > 0 && ch.coyote > 0) {
    const boost = state.linked ? LINK_BOOST : 1;
    doJump(ch, boost);
    const o = other(ch);
    if (state.linked && o.alive && o.coyote > 0 && o.vy >= 0) doJump(o, boost);
  }
  ch.vy += GRAV;
  if (ch.vy < 0 && !up && !ch.linkJump) ch.vy += GRAV * 0.9; // коротше натискання — нижчий стрибок
  if (ch.vy >= 0) ch.linkJump = false;
  if (ch.vy > MAXFALL) ch.vy = MAXFALL;
  if (ch.ground && ch.ground.lily) ch.y += ch.ground.lily.dy;

  const wasGrounded = ch.grounded, fallV = ch.vy;
  moveChar(ch);
  if (ch.grounded && !wasGrounded) land(ch, fallV);
  ch.airT = ch.grounded ? 0 : ch.airT + 1;
  if (ch.grounded) {
    ch.runPhase += Math.abs(ch.vx) * 0.085;
    const b = ch.y + ch.h, tier = b <= 281 ? 2 : b <= 481 ? 1 : 0;
    if (tier > ch.tier) ch.tier = tier;
  }
  checkHazard(ch);
}

function setLinked(on, silent) {
  state.linked = on;
  if (silent) return;
  toast(on ? 'linked' : 'unlinked');
  if (on) {
    const [a, b] = chars, mx = (a.x + b.x + a.w) / 2, my = (a.y + b.y) / 2 + 14;
    for (let i = 0; i < 8; i++) emit('star', mx + (rnd() - 0.5) * 20, my, { vx: (rnd() - 0.5) * 1.6, vy: -0.8 - rnd() * 1.2, drag: 0.96, size: 1.3 + rnd(), life: 40, col: i % 2 ? '#ffd27a' : '#bdf0ff', add: true, vr: 0.15 });
  }
}

function updateLink() {
  const [a, b] = chars;
  const dx = b.x + b.w / 2 - (a.x + a.w / 2), dy = b.y + b.h - (a.y + a.h);
  if (a.alive && b.alive) {
    if (pressed.has(KEYS.zharok.down) || pressed.has(KEYS.khvylka.down)) {
      if (state.linked) setLinked(false);
      else if (Math.abs(dx) < 60 && Math.abs(dy) < 16) setLinked(true);
      else toast('closer');
    }
    if (state.linked && Math.hypot(dx, dy) > 90) setLinked(false);
  } else if (state.linked) setLinked(false, true);
  a.linkDir = state.linked ? Math.sign(dx) || 1 : 0;
  b.linkDir = -a.linkDir;
}

function pushOut(ch, r) {
  gatherSolids(r.x - 60, ch.y - 10, r.x + r.w + 60, ch.y + ch.h + 10);
  const left = r.x - ch.w, right = r.x + r.w;
  for (const x of ch.x + ch.w / 2 < r.x + r.w / 2 ? [left, right] : [right, left]) {
    if (hitsAny({ x, y: ch.y, w: ch.w, h: ch.h })) continue;
    ch.x = x; ch.vx = 0;
    return true;
  }
  return false;
}

const atDoor = (ch, d) => ch.alive && ch.grounded && Math.abs(ch.x + ch.w / 2 - d.x) < 14 && Math.abs(ch.y + ch.h - PLATE_Y) < 3;
// 0 → 1, поки герої після перемоги «заходять» у двері
const enterFade = () => (state.won ? clamp((state.ticks - state.winTicks - 18) / 28, 0, 1) : 0);

function updateWorld() {
  for (const l of lilies) {
    const standing = chars.some((c) => c.alive && c.ground && c.ground.lily === l);
    l.sink += ((standing ? 3 : 0) - l.sink) * 0.15;
    const top = l.base + Math.sin(state.ticks * 0.05 + l.ph) * 1.6 + l.sink;
    l.dy = top - l.top; l.top = top;
  }
  for (const p of plates) {
    p.pressed = chars.some((c) => c.alive && c.grounded && Math.abs(c.y + c.h - PLATE_Y) < 2 &&
      Math.min(c.x + c.w, p.x + p.w) - Math.max(c.x, p.x) >= 6);
    p.depress += ((p.pressed ? 1 : 0) - p.depress) * 0.3;
  }
  const want = plates.some((p) => p.pressed) ? 1 : 0;
  if (want > gate.open) gate.open = Math.min(1, gate.open + GATE_OPEN_SPEED);
  else if (want < gate.open) {
    // ворота падають швидко і не чекають: того, хто під ними, виштовхують на його бік
    const next = Math.max(0, gate.open - GATE_CLOSE_SPEED), gr = gateRect(next);
    if (!gr || chars.every((c) => !c.alive || !overlaps(c, gr) || pushOut(c, gr))) {
      gate.open = next;
      if (next === 0) for (let i = 0; i < 8; i++) emit('steam', gate.x + (rnd() - 0.5) * 30, PLATE_Y - 2, { vx: (rnd() - 0.5) * 2, vy: -rnd() * 0.5, size: 2 + rnd() * 2, grow: 0.08, life: 24, col: '#c9c2ea' });
    }
  }
  for (const it of state.items) {
    if (it.taken) continue;
    for (const ch of chars) {
      if (!ch.alive || (it.kind === 'spark' && ch.kind !== 'zharok') || (it.kind === 'drop' && ch.kind !== 'khvylka')) continue;
      const dx = ch.x + ch.w / 2 - it.x, dy = ch.y + ch.h / 2 - it.y;
      if (dx * dx + dy * dy > 24 * 24) continue;
      it.taken = true; state.counts[it.kind]++;
      const col = it.kind === 'spark' ? '#ffcf6a' : it.kind === 'drop' ? '#a6eaff' : '#ff8fb8';
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * TAU, s = 1.5 + rnd() * 1.5;
        emit('star', it.x, it.y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, drag: 0.93, size: 1.4 + rnd(), life: 30, col, add: true, vr: 0.15 });
      }
      emit('ring', it.x, it.y, { size: 6, grow: 1.2, life: 18, col });
      if (it.kind === 'heart') toast('heart');
      break;
    }
  }
  // рівень пройдено, коли обидва одночасно стоять кожен біля своїх дверей
  for (const d of doors) {
    d.at = atDoor(chars.find((c) => c.kind === d.owner), d);
    d.lit += ((d.at ? 1 : 0) - d.lit) * 0.15;
    d.open += ((state.won ? 1 : 0) - d.open) * 0.08;
  }
  if (!state.won && doors.every((d) => d.at)) {
    state.won = true; state.winTicks = state.ticks; state.result = rating();
    for (const d of doors) {
      const col = d.owner === 'zharok' ? '#ffd27a' : '#bdf0ff';
      for (let i = 0; i < 24; i++) {
        const a = rnd() * TAU, s = 1 + rnd() * 2.5;
        emit('star', d.x, PLATE_Y - 40, { vx: Math.cos(a) * s, vy: Math.sin(a) * s, drag: 0.95, size: 1.4 + rnd() * 1.4, life: 55, col, add: true, vr: 0.1 });
      }
    }
  }
}

function updateAmbient() {
  for (const p of pools) {
    const w = p.x1 - p.x0 - 6, surf = p.y + 8;
    if (p.kind === 'F' && rnd() < 0.0018 * w) {
      emit('spark', p.x0 + 3 + rnd() * w, surf - 2, { vx: (rnd() - 0.5) * 0.4, vy: -0.8 - rnd() * 1.4, g: -0.004, size: 1.3 + rnd(), life: 40 + rnd() * 40, col: '#ffcf6a', add: true, sprite: glow.fire });
    }
    if (p.kind === 'B') {
      if (p.bubbles.length < w / 26 && rnd() < 0.04) p.bubbles.push({ x: p.x0 + 8 + rnd() * (w - 10), r: 0, max: 2.5 + rnd() * 3.5, sp: 0.04 + rnd() * 0.05 });
      for (let i = p.bubbles.length - 1; i >= 0; i--) {
        const b = p.bubbles[i];
        b.r += b.sp;
        if (b.r < b.max) continue;
        emit('ring', b.x, surf - 1, { size: b.r, grow: 0.5, life: 14, col: '#d6e47c' });
        for (let k = 0; k < 3; k++) emit('dot', b.x, surf - 2, { vx: (rnd() - 0.5) * 1.4, vy: -0.8 - rnd(), g: 0.12, size: 1.2, life: 18, col: '#8f9f3a' });
        p.bubbles.splice(i, 1);
      }
    }
  }
  const [a, b] = chars;
  if (a.alive && !state.won && rnd() < 0.22) emit('spark', a.x + a.w / 2 + (rnd() - 0.5) * 10, a.y - 10, { vx: -a.vx * 0.15 + (rnd() - 0.5) * 0.5, vy: -0.9 - rnd() * 1.2, g: -0.01, size: 1.1 + rnd() * 0.8, life: 30 + rnd() * 20, col: '#ffd36a', add: true, sprite: glow.fire });
  if (b.alive && b.grounded && Math.abs(b.vx) > 1 && rnd() < 0.25) emit('dot', b.x + b.w / 2 - b.facing * 8, b.y + b.h - 4, { vx: -b.facing * 0.8 + (rnd() - 0.5), vy: -1.2 - rnd(), g: 0.18, size: 1.5, life: 24, col: '#9fe6ff' });
  if (state.linked && !state.won) {
    const mx = (a.x + a.w / 2 + b.x + b.w / 2) / 2, my = (a.y + a.h + b.y + b.h) / 2 - 14;
    if (rnd() < 0.35) emit('steam', mx + (rnd() - 0.5) * 6, my, { vx: (rnd() - 0.5) * 0.4, vy: -0.6 - rnd() * 0.6, size: 2.5 + rnd() * 2, grow: 0.12, life: 50, col: '#f4f7ff' });
  }
  for (const d of doors) {
    if (d.lit > 0.5 && rnd() < 0.15) emit('star', d.x + (rnd() - 0.5) * 30, PLATE_Y - 80 + (rnd() - 0.5) * 20, { vy: -0.4, size: 1.2 + rnd(), life: 40, col: d.owner === 'zharok' ? '#ffd27a' : '#bdf0ff', add: true, vr: 0.05 });
  }
  if (state.won) {
    // з відчинених дверей ллється світло й вилітають іскри своїх кольорів
    for (const d of doors) {
      if (rnd() < 0.12) emit('star', d.x + (rnd() - 0.5) * 30, PLATE_Y - 10 - rnd() * 40, { vx: (rnd() - 0.5) * 0.6, vy: -0.6 - rnd() * 0.6, size: 1.2 + rnd(), life: 50, col: d.owner === 'zharok' ? '#ffd27a' : '#bdf0ff', add: true, vr: 0.08 });
    }
  }
}

// ===== Частинки =====
// ui: true — частинка інтерфейсу, малюється поверх меню, а не під ним
function emit(type, x, y, o = {}) {
  const list = o.ui ? uiParts : parts;
  if (list.length > 1400) return;
  const life = o.life ?? 40;
  list.push({ type, x, y, vx: o.vx ?? 0, vy: o.vy ?? 0, g: o.g ?? 0, drag: o.drag ?? 1, life, max: life, size: o.size ?? 2, grow: o.grow ?? 0, col: o.col ?? '#fff', add: !!o.add, sprite: o.sprite, rot: rnd() * TAU, vr: o.vr ?? 0 });
}
function updateParticles(list) {
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i];
    p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag; p.x += p.vx; p.y += p.vy; p.size += p.grow; p.rot += p.vr;
    if (--p.life <= 0) { list[i] = list[list.length - 1]; list.pop(); }
  }
}

// ===== Підсумки рівня: ★ пройдено, ★★ половина скарбів, ★★★ усі скарби, діамантова — сердечко =====
const TOTAL_GEMS = ITEM_DEFS.filter((d) => d.kind !== 'heart').length;
const PANEL_AT = 50, STAR_AT = PANEL_AT + 22, STAR_GAP = 16, DIAMOND_AT = STAR_AT + 3 * STAR_GAP + 8;
const STAR_SLOTS = [{ x: 565, y: 300, r: 27 }, { x: 640, y: 286, r: 35 }, { x: 715, y: 300, r: 27 }];
const DIAMOND_SLOT = { x: 640, y: 370, r: 22 };
const AGAIN_BTN = { x: 565, y: 466, w: 150, h: 40 };
function rating() {
  const gems = state.counts.spark + state.counts.drop;
  return { gems, stars: 1 + (gems * 2 >= TOTAL_GEMS ? 1 : 0) + (gems === TOTAL_GEMS ? 1 : 0), diamond: state.counts.heart > 0 };
}
function updateResults() {
  if (!state.won) return;
  const since = state.ticks - state.winTicks, r = state.result;
  const burst = (s, cols) => {
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * TAU, v = 2 + rnd() * 2.5;
      emit('star', s.x, s.y, { vx: Math.cos(a) * v, vy: Math.sin(a) * v, drag: 0.9, size: 1.5 + rnd() * 1.5, life: 34, col: cols[i % cols.length], add: true, vr: 0.2, ui: true });
    }
  };
  for (let i = 0; i < r.stars; i++) if (since === STAR_AT + i * STAR_GAP) burst(STAR_SLOTS[i], ['#ffe08a', '#ffb347', '#fff6c0']);
  if (r.diamond && since === DIAMOND_AT) burst(DIAMOND_SLOT, ['#f2fdff', '#9fe6ff', '#d9c8ff']);
}

function tick() {
  state.ticks++;
  for (const ch of chars) updateChar(ch);
  updateLink();
  updateWorld();
  updateAmbient();
  updateResults();
  updateParticles(parts);
  updateParticles(uiParts);
  for (const to of state.toasts) to.t--;
  state.toasts = state.toasts.filter((x) => x.t > 0);
  pressed.clear();
}

// ===== Рендер: допоміжне =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let pxScale = 1, bgLayer = null, terrainLayer = null, vignetteLayer = null;

function makeGlow(r, g, b) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(0.35, `rgba(${r},${g},${b},.45)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128);

}
const glow = {
  fire: makeGlow(255, 140, 50), water: makeGlow(80, 190, 255), gold: makeGlow(255, 205, 90),
  fly: makeGlow(210, 255, 120), white: makeGlow(255, 255, 255), pink: makeGlow(255, 120, 170),
};
function drawGlow(g, sprite, x, y, r, a) { g.globalAlpha = a; g.drawImage(sprite, x - r, y - r, r * 2, r * 2); g.globalAlpha = 1; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); }

function star4(g, x, y, r, rot = 0) {
  g.beginPath();
  for (let i = 0; i < 8; i++) { const a = rot + (i * Math.PI) / 4, q = i % 2 ? r * 0.32 : r; g.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  g.closePath();
}
function heartPath(g, x, y, s) {
  g.beginPath(); g.moveTo(x, y + s * 0.9);
  g.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.7, y - s * 1.2, x, y - s * 0.45);
  g.bezierCurveTo(x + s * 0.7, y - s * 1.2, x + s * 1.4, y - s * 0.1, x, y + s * 0.9);
  g.closePath();
}
function makeLayer() {
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  const g = c.getContext('2d');
  g.setTransform(pxScale, 0, 0, pxScale, 0, 0);
  return [c, g];
}

// ===== Фон: нічне небо Купала, Карпати, ліс =====
function renderBackground(g) {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0d1236'); sky.addColorStop(0.4, '#1f2462'); sky.addColorStop(0.75, '#3b3274'); sky.addColorStop(1, '#5a3f78');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // Чумацький Шлях
  g.save(); g.translate(W * 0.55, H * 0.2); g.rotate(-0.35); g.scale(1, 0.16);
  const mw = g.createRadialGradient(0, 0, 0, 0, 0, 700);
  mw.addColorStop(0, 'rgba(200,190,255,.17)'); mw.addColorStop(1, 'rgba(200,190,255,0)');
  g.fillStyle = mw; circ(g, 0, 0, 700); g.fill(); g.restore();
  const r = mulberry32(11);
  for (let i = 0; i < 220; i++) {
    const x = r() * W, y = r() * H * 0.62, big = r() < 0.08;
    g.globalAlpha = 0.25 + r() * 0.6; g.fillStyle = r() < 0.2 ? '#ffe2b0' : '#f2f0ff';
    circ(g, x, y, big ? 1.5 : 0.5 + r() * 0.7); g.fill();
  }
  g.globalAlpha = 1;
  // місяць
  const mx = 790, my = 92;
  const halo = g.createRadialGradient(mx, my, 20, mx, my, 150);
  halo.addColorStop(0, 'rgba(255,236,200,.33)'); halo.addColorStop(1, 'rgba(255,236,200,0)');
  g.fillStyle = halo; g.fillRect(mx - 150, my - 150, 300, 300);
  const moon = g.createRadialGradient(mx - 8, my - 8, 4, mx, my, 30);
  moon.addColorStop(0, '#fffaf0'); moon.addColorStop(1, '#f1dcae');
  g.fillStyle = moon; circ(g, mx, my, 28); g.fill();
  g.fillStyle = 'rgba(200,165,120,.25)';
  for (const [dx, dy, cr] of [[-9, -6, 6], [8, 5, 4], [-2, 11, 3]]) { circ(g, mx + dx, my + dy, cr); g.fill(); }
  ridge(g, 330, 110, 3, '#2b2a66', 6);
  mist(g, 360, '160,150,230', 0.07);
  ridge(g, 450, 80, 5, '#232259', 5);
  mist(g, 480, '160,150,230', 0.06);
  ridge(g, 570, 50, 9, '#1c1b4a', 4);
  firs(g, 650, '#16153d');
}
function ridge(g, baseY, amp, seed, color, step) {
  const r = mulberry32(seed), p1 = r() * 6, p2 = r() * 6, p3 = r() * 6;
  g.fillStyle = color; g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W + step; x += step) {
    g.lineTo(x, baseY - amp * (0.55 * Math.sin(x * 0.0042 + p1) + 0.3 * Math.sin(x * 0.0115 + p2) + 0.15 * Math.abs(Math.sin(x * 0.03 + p3))));
  }
  g.lineTo(W, H); g.closePath(); g.fill();
}
function mist(g, y, rgb, a) {
  const gr = g.createLinearGradient(0, y - 60, 0, y + 60);
  gr.addColorStop(0, `rgba(${rgb},0)`); gr.addColorStop(0.5, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, y - 60, W, 120);
}
function firs(g, baseY, color) {
  const r = mulberry32(21);
  g.fillStyle = color; g.fillRect(0, baseY, W, H - baseY);
  for (let x = -10; x < W + 20; x += 14 + r() * 18) {
    const h = 40 + r() * 50, w = h * 0.36, y = baseY + 4 - r() * 10;
    const tiers = [1, 2, 3, 4].map((k) => [y - h + (h * k) / 4, (w * k) / 4 + 3]);
    g.beginPath(); g.moveTo(x, y - h);
    tiers.forEach(([yy, ww], i) => { g.lineTo(x + ww, yy); if (i < 3) g.lineTo(x + ww * 0.4, yy - 3); });
    g.lineTo(x + 3, y); g.lineTo(x + 3, y + 8); g.lineTo(x - 3, y + 8); g.lineTo(x - 3, y);
    for (let i = 3; i >= 0; i--) { const [yy, ww] = tiers[i]; g.lineTo(x - ww, yy); if (i > 0) g.lineTo(x - tiers[i - 1][1] * 0.4, tiers[i - 1][0] - 3); }
    g.closePath(); g.fill();
  }
}

// ===== Земля, басейни, платформи =====
const solidAt = (c, r) => isSolidish(tileAt(c, r));
function cornerRadii(c, r, rad) {
  const L = !solidAt(c - 1, r), Rt = !solidAt(c + 1, r), U = !solidAt(c, r - 1), D = !solidAt(c, r + 1);
  return [L && U ? rad : 0, Rt && U ? rad : 0, Rt && D ? rad : 0, L && D ? rad : 0];
}
function forTiles(fn) { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) fn(MAP[r][c], c, r, c * T, r * T); }

function renderTerrain(g) {
  // 1) темний контур: трохи збільшені плитки під основними
  g.fillStyle = '#140f26';
  forTiles((ch, c, r, x, y) => {
    if (ch === '#') { rr(g, x - 3, y - 3, T + 6, T + 6, cornerRadii(c, r, 12)); g.fill(); }
    else if (isLiquid(ch)) { g.fillRect(x - 3, y + 3, T + 6, T); }
    else if (ch === '=') { rr(g, x - 2.5, y - 2.5, T + 5, 17, 5); g.fill(); }
  });
  // 2) камінь
  const rand = mulberry32(5);
  forTiles((ch, c, r, x, y) => {
    if (ch === '#') {
      const radii = cornerRadii(c, r, 9);
      g.fillStyle = '#3b3254'; rr(g, x, y, T, T, radii); g.fill();
      for (let i = 0; i < 3; i++) {
        const sx = x + 8 + rand() * 24, sy = y + 10 + rand() * 22, w = 4 + rand() * 5, h = 3 + rand() * 3;
        g.fillStyle = '#453c62'; ell(g, sx, sy, w, h); g.fill();
        g.fillStyle = 'rgba(110,98,150,.35)'; ell(g, sx - 1, sy - h * 0.45, w * 0.6, h * 0.35); g.fill();
      }
      g.fillStyle = '#2b2442';
      for (let i = 0; i < 3; i++) { circ(g, x + 5 + rand() * 30, y + 6 + rand() * 30, 0.9 + rand() * 0.8); g.fill(); }

  g.save(); g.translate(106, 20); g.scale(0.7, 0.7); drawDropGem(g, t); g.restore();

  heartPath(g, 184, 20, 7); g.fillStyle = '#ff6f9f'; g.fill(); g.strokeStyle = '#8a1a43'; g.lineWidth = 1.3; g.stroke();
  g.fillStyle = '#fff4e0'; g.fillText(`${c.heart}/1`, 196, 21);
  g.fillStyle = '#b9b3d9'; g.fillText(fmtTime(state.won ? state.winTicks : state.ticks), 262, 21);
  g.font = '900 21px Nunito, system-ui, sans-serif'; g.textAlign = 'center';
  const title = tr('title'), tw = g.measureText(title).width;
  const tg = g.createLinearGradient(W / 2 - tw / 2, 0, W / 2 + tw / 2, 0);
  tg.addColorStop(0, '#ffb347'); tg.addColorStop(0.5, '#fff0c0'); tg.addColorStop(1, '#7fd8ff');
  g.lineWidth = 5; g.strokeStyle = '#140f26'; g.lineJoin = 'round'; g.strokeText(title, W / 2, 21);
  g.fillStyle = tg; g.fillText(title, W / 2, 21);
  for (const to of state.toasts) {
    const a = Math.min(1, to.t / 30, (170 - to.t) / 12);
    g.globalAlpha = a; g.font = '800 17px Nunito, system-ui, sans-serif';
    const text = tr(to.key), w = g.measureText(text).width + 44;
    g.fillStyle = 'rgba(12,10,34,.85)'; rr(g, W / 2 - w / 2, 48, w, 32, 16); g.fill();
    g.strokeStyle = 'rgba(243,193,75,.5)'; g.lineWidth = 1.2; g.stroke();
    g.fillStyle = '#fff4e0'; g.fillText(text, W / 2, 65);
    g.globalAlpha = 1;
  }
  if (state.won) drawResults(g, t);
}

function star5(g, x, y, r, inner = 0.5) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, q = i % 2 ? r * inner : r; g.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
  g.closePath();
}
function drawStarSlot(g, s) {
  star5(g, s.x, s.y, s.r); g.fillStyle = '#272148'; g.fill();
  g.strokeStyle = '#3d3772'; g.lineWidth = 3; g.lineJoin = 'round'; g.stroke();
}
function drawGoldStar(g, s, k) {
  const r = s.r * backOut(k);
  g.globalCompositeOperation = 'lighter'; drawGlow(g, glow.gold, s.x, s.y, r * 2.2, 0.5 * k); g.globalCompositeOperation = 'source-over';
  star5(g, s.x, s.y, r);
  const grd = g.createRadialGradient(s.x - r * 0.25, s.y - r * 0.3, r * 0.1, s.x, s.y, r);
  grd.addColorStop(0, '#fff8d0'); grd.addColorStop(0.45, '#ffd23f'); grd.addColorStop(1, '#ee9a1a');
  g.fillStyle = grd; g.fill();
  g.strokeStyle = '#7a4a08'; g.lineWidth = 3; g.lineJoin = 'round'; g.stroke();
  g.fillStyle = 'rgba(255,255,255,.65)'; ell(g, s.x - r * 0.22, s.y - r * 0.28, r * 0.16, r * 0.09, -0.6); g.fill();
}
function drawDiamondStar(g, s, k, t) {
  const r = s.r * backOut(k);
  g.globalCompositeOperation = 'lighter';
  drawGlow(g, glow.white, s.x, s.y, r * 2.4, 0.45 * k); drawGlow(g, glow.water, s.x, s.y, r * 2.8, 0.35 * k);
  g.globalCompositeOperation = 'source-over';
  star5(g, s.x, s.y, r);
  const grd = g.createLinearGradient(s.x - r, s.y - r, s.x + r, s.y + r);
  grd.addColorStop(0, '#f2fdff'); grd.addColorStop(0.45, '#9fe6ff'); grd.addColorStop(1, '#b9a6ff');
  g.fillStyle = grd; g.fill();
  // грані кристала
  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 1;
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5, q = i % 2 ? r * 0.5 : r;
    g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x + Math.cos(a) * q, s.y + Math.sin(a) * q); g.stroke();
  }
  star5(g, s.x, s.y, r); g.strokeStyle = '#2a4a8a'; g.lineWidth = 3; g.lineJoin = 'round'; g.stroke();
  g.fillStyle = '#fff'; star4(g, s.x + r * 0.35, s.y - r * 0.45, 3 + Math.sin(t * 5) * 1.5, t); g.fill();
}
let hoverAgain = false;
function drawResults(g, t) {
  const since = state.ticks - state.winTicks, r = state.result;
  if (since < PANEL_AT) return;
  g.globalAlpha = clamp((since - PANEL_AT) / 15, 0, 1);
  g.fillStyle = 'rgba(6,5,20,.5)'; g.fillRect(0, 40, W, H - 40);
  const px = W / 2 - 250, py = 170;
  g.fillStyle = 'rgba(16,12,42,.96)'; rr(g, px, py, 500, 360, 26); g.fill();
  g.strokeStyle = '#f3c14b'; g.lineWidth = 2; g.stroke();
  g.fillStyle = 'rgba(243,193,75,.35)';
  for (let i = 0; i < 9; i++) { circ(g, px + 50 + i * 50, py + 12, 2); g.fill(); circ(g, px + 50 + i * 50, py + 348, 2); g.fill(); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 32px Nunito, system-ui, sans-serif';
  const wt = tr('win'), ww = g.measureText(wt).width;
  const wg = g.createLinearGradient(W / 2 - ww / 2, 0, W / 2 + ww / 2, 0);
  wg.addColorStop(0, '#ffb347'); wg.addColorStop(0.5, '#fff0c0'); wg.addColorStop(1, '#7fd8ff');
  g.fillStyle = wg; g.fillText(wt, W / 2, py + 44);
  // зірки з'являються по черзі; незароблені лишаються порожніми слотами
  STAR_SLOTS.forEach((s, i) => {
    drawStarSlot(g, s);
    const at = STAR_AT + i * STAR_GAP;
    if (i < r.stars && since >= at) drawGoldStar(g, s, clamp((since - at) / 14, 0, 1));
  });
  drawStarSlot(g, DIAMOND_SLOT);
  if (r.diamond && since >= DIAMOND_AT) drawDiamondStar(g, DIAMOND_SLOT, clamp((since - DIAMOND_AT) / 14, 0, 1), t);
  g.font = '700 14px Nunito, system-ui, sans-serif';
  g.fillStyle = r.diamond ? '#bfeeff' : '#8f88b8';
  g.fillText(tr(r.diamond ? 'diamondGot' : 'diamondHint'), W / 2, py + 236);
  // рядок зібраного
  const c = state.counts, rowY = py + 272;
  g.font = '800 17px Nunito, system-ui, sans-serif'; g.textAlign = 'left'; g.fillStyle = '#fff4e0';
  g.save(); g.translate(478, rowY); g.scale(0.75, 0.75); drawSparkGem(g, t); g.restore();
  g.fillText(`${c.spark}/3`, 492, rowY + 1);
  g.save(); g.translate(566, rowY); g.scale(0.75, 0.75); drawDropGem(g, t); g.restore();
  g.fillText(`${c.drop}/3`, 580, rowY + 1);
  heartPath(g, 654, rowY, 7.5); g.fillStyle = '#ff6f9f'; g.fill(); g.strokeStyle = '#8a1a43'; g.lineWidth = 1.3; g.stroke();
  g.fillStyle = '#fff4e0'; g.fillText(`${c.heart}/1`, 667, rowY + 1);
  g.fillStyle = '#b9b3d9'; g.fillText(`${tr('time')} ${fmtTime(state.winTicks)}`, 726, rowY + 1);
  // кнопка «Ще раз»
  const b = AGAIN_BTN;
  g.fillStyle = hoverAgain ? '#ffd76a' : '#f3c14b'; rr(g, b.x, b.y, b.w, b.h, 20); g.fill();
  g.strokeStyle = '#7a4a08'; g.lineWidth = 2; g.stroke();
  g.textAlign = 'center'; g.font = '900 17px Nunito, system-ui, sans-serif'; g.fillStyle = '#2a1a08';
  g.fillText(tr('again'), b.x + b.w / 2, b.y + b.h / 2 + 1);
  g.globalAlpha = 1;
  drawParticles(g, uiParts);
}

// ===== Персонажі зблизька (клавіша C) =====
let showcase = false;
function drawShowcase(g, t) {
  g.fillStyle = 'rgba(8,7,26,.86)'; g.fillRect(0, 40, W, H - 40);
  const cards = [
    { kind: 'zharok', x: W / 2 - 260, name: 'nameZharok', desc: 'descZharok', col: '#ffb347' },
    { kind: 'khvylka', x: W / 2 + 260, name: 'nameKhvylka', desc: 'descKhvylka', col: '#7fd8ff' },
  ];
  cards.forEach((cd, i) => {
    const src = chars[i], hop = Math.max(0, Math.sin(t * 1.6 + i * 1.7)) ** 6;
    const pose = {
      ...src, alive: true, appear: 0, vx: 0, vy: hop > 0.05 ? -4 * Math.cos(t * 1.6 + i * 1.7) : 0,
      grounded: hop < 0.05, linkDir: i === 0 ? 1 : -1, sx: 1 + hop * 0.05, sy: 1 - hop * 0.04, happy: Math.sin(t * 0.7) > 0.3,
    };
    const fy = 470 - hop * 40;
    g.globalCompositeOperation = 'lighter';
    drawGlow(g, i === 0 ? glow.fire : glow.water, cd.x, fy - 110, 230, i === 0 ? 0.35 : 0.25);
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = 'rgba(0,0,0,.35)'; ell(g, cd.x, 474, 70 - hop * 20, 10); g.fill();
    g.save(); g.translate(cd.x, fy); g.scale(5 * pose.sx, 5 * pose.sy);
    if (pose.grounded) g.translate(0, Math.sin(t * 3.2 + i * 1.4) * 1.1);
    const L = limbs(pose, t);
    if (i === 0) drawZharok(g, pose, t, L); else drawKhvylka(g, pose, t, L);
    g.restore();
    g.textAlign = 'center'; g.font = '900 34px Nunito, system-ui, sans-serif';
    g.lineWidth = 6; g.strokeStyle = '#140f26'; g.strokeText(tr(cd.name), cd.x, 540);
    g.fillStyle = cd.col; g.fillText(tr(cd.name), cd.x, 540);
    g.font = '700 16px Nunito, system-ui, sans-serif'; g.fillStyle = '#d9d3f2';
    tr(cd.desc).forEach((line, k) => g.fillText(line, cd.x, 576 + k * 22));
  });
  g.font = '800 15px Nunito, system-ui, sans-serif'; g.fillStyle = '#b9b3d9';
  g.fillText(tr('showcaseHint'), W / 2, 690);
}

// ===== Головний цикл =====
function render(alpha, now) {
  const t = now / 1000;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgLayer, 0, 0);
  ctx.setTransform(pxScale, 0, 0, pxScale, 0, 0);
  drawLiveBackground(ctx, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(terrainLayer, 0, 0);
  ctx.setTransform(pxScale, 0, 0, pxScale, 0, 0);
  for (const p of pools) drawPool(ctx, p, t, false);
  for (const l of lilies) drawLily(ctx, l, t);
  for (const p of plates) drawPlate(ctx, p);
  drawGate(ctx, t);
  state.items.forEach((it, i) => drawItem(ctx, it, t, i));
  for (const d of doors) drawDoor(ctx, d, t);
  drawCharGlows(ctx, alpha, t);
  for (const ch of chars) drawCharacter(ctx, ch, alpha, t);
  drawLinkBridge(ctx, alpha, t);
  for (const p of pools) drawPool(ctx, p, t, true);
  drawParticles(ctx, parts);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(vignetteLayer, 0, 0);
  ctx.setTransform(pxScale, 0, 0, pxScale, 0, 0);
  if (showcase) drawShowcase(ctx, t);
  drawHUD(ctx, t);
}

const stage = document.getElementById('stage'), helpEl = document.getElementById('help');
function renderHelp() {
  helpEl.innerHTML = tr('help').map(([label, keys]) => `<span><b>${label}</b>${keys.map((k) => `<kbd>${k}</kbd>`).join('')}</span>`).join('');
  document.querySelectorAll('#lang button').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
  document.documentElement.lang = lang === 'uk' ? 'uk' : 'en';
}
document.querySelectorAll('#lang button').forEach((b) => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('zh-lang', lang); } catch (e) { /* без сховища — лише на цю сесію */ }
  renderHelp(); resize(); b.blur();
}));
// кнопка «Ще раз» у меню підсумків
function overAgain(e) {
  if (!state.won || state.ticks - state.winTicks < PANEL_AT + 10) return false;
  const r = canvas.getBoundingClientRect(), b = AGAIN_BTN;
  const x = ((e.clientX - r.left) / r.width) * W, y = ((e.clientY - r.top) / r.height) * H;
  return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
}
canvas.addEventListener('click', (e) => { if (overAgain(e)) reset(); });
canvas.addEventListener('mousemove', (e) => { hoverAgain = overAgain(e); canvas.style.cursor = hoverAgain ? 'pointer' : ''; });

function resize() {
  const availW = innerWidth - 24, availH = innerHeight - 34 - helpEl.offsetHeight;
  const scale = Math.max(0.2, Math.min(availW / W, availH / H));
  const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
  stage.style.width = cssW + 'px'; stage.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  pxScale = canvas.width / W;
  let g;
  [bgLayer, g] = makeLayer(); renderBackground(g);
  [terrainLayer, g] = makeLayer(); renderTerrain(g);
  [vignetteLayer, g] = makeLayer(); renderVignette(g);
}
addEventListener('resize', resize);

let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  let steps = 0;
  while (acc >= STEP && steps < 5) { tick(); acc -= STEP; steps++; }
  if (steps === 5) acc = 0;
  render(acc / STEP, now);
  requestAnimationFrame(frame);
}

renderHelp();
reset();
resize();
requestAnimationFrame(frame);
if (document.fonts) document.fonts.ready.then(resize);
</script>
